name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-file-manager-${{ matrix.os }}
          path: dsh-file-manager-*.tgz
